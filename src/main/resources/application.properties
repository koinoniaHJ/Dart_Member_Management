# 1. 서버 포트 설정
server.port=8080

# 2. 오라클 DB 연결 설정 (본인 정보에 맞게 수정 필수)
# - localhost: 오라클이 네 컴퓨터에 깔려있다면 그대로 두고, 외부 서버라면 IP 주소 입력
# - 1521: 오라클 기본 포트 번호
# - xe: 오라클 DB의 SID (무료 버전인 Express Edition은 보통 xe이고, 유료 버전은 주로 orcl)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=system
spring.datasource.password=oracle

# 3. 오라클 데이터베이스 드라이버 클래스
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# 4. JPA가 오라클 문법(Dialect)으로 SQL을 번역하도록 지정
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# 5. 콘솔창에 SQL 쿼리 예쁘게 찍어주는 설정
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 6. DDL 자동 생성 설정 (update: 자바 코드를 바탕으로 오라클에 테이블을 자동 생성/수정)
spring.jpa.hibernate.ddl-auto=update