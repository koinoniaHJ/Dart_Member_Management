<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAVANA</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        
        <header class="app-header">
            <img th:src="@{/images/header-icon.png}" id="header-icon" alt="Savana Logo" class="header-logo">
            <h1 class="header-title">SAVANA</h1>
        </header>

        <main class="app-main">
            
            <form id="search-form" action="" method="GET" class="search-form">
                <input type="text" id="search-keyword" name="search-keyword" class="search-input" placeholder="회원 검색">
                <button type="submit" id="search-btn" class="search-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </form>

            <section class="list-header">
                <h2 class="list-title">회원 목록</h2>
                <button type="button" id="add-member-btn" class="btn-add">추가</button>
            </section>

            <ul id="member-list" class="member-list">
    
			    <li class="member-item" th:each="m : ${members}" th:data-member-id="${m.memberId}">
			        <div class="profile-img-wrapper">
			        	<!-- images 컬럼이 비어있지 않다면 실제 이미지 등록 -->
					    <img th:if="${not #strings.isEmpty(m.images)}" 
					         th:src="@{${m.images}}" 
					         alt="Profile" class="profile-img">
					    <!-- 이미지가 존재하는 게 아니라면 더미 이미지 등록 -->    
					    <img th:unless="${not #strings.isEmpty(m.images)}" 
					         th:src="@{/images/dummy-profile.png}" 
					         alt="Profile" class="profile-img">
					</div>
			        
			        <div class="member-info">
			            <p class="info-row"><span class="info-label">이름 :</span> <span class="info-value" th:text="${m.name}">TEST</span></p>
			            <p class="info-row"><span class="info-label">닉네임 :</span> <span class="info-value" th:text="${m.nickName}">TEST</span></p>
			            <p class="info-row"><span class="info-label">나이 :</span> <span class="info-value" th:text="${m.age}">20</span></p>
			            <p class="info-row"><span class="info-label">RATING :</span> <span class="info-value" th:text="${m.rating}">C5</span></p>
			        </div>
			    </li>
			
			</ul>
			
			<!-- 페이지네이션 -->
			<nav id="pagination-container" class="pagination-container" th:if="${totalPages > 0}">
			    <ul class="pagination-list">
			        
			        <li class="page-item">
			            <a th:if="${hasPrev}" th:href="@{/(page=${currentPage - 1})}" class="page-btn prev-btn">◀</a>
			            <span th:unless="${hasPrev}" class="page-btn prev-btn disabled">◀</span>
			        </li>
			
					<!-- #numbers.sequence(시작숫자, 끝숫자) : 타임리프 내장 기능을 사용해 
					startPage부터 endPage까지의 숫자 배열을 만들고 순서대로 돌리는 것 -->
			        <li class="page-item" 
			            th:each="pageNo : ${#numbers.sequence(startPage, endPage)}" 
			            th:classappend="${pageNo == currentPage} ? 'active'">
			            <a th:href="@{/(page=${pageNo})}" class="page-btn" th:text="${pageNo}">1</a>
			        </li>
			        <!-- 브라우저에 도달할 때 아래처럼 5개의 독립된 구체적인 HTML 태그로 변환되어 
			        page 파라미터가 controller 로 전달 되는 것.
			        <li class="page-item">
			          	<a href="/?page=1" class="page-btn">1</a>
			        </li>
					<li class="page-item">
						<a href="/?page=2" class="page-btn">2</a>
					</li>
					<li class="page-item active">
						<a href="/?page=3" class="page-btn">3</a>
					</li> 
					<li class="page-item">
						<a href="/?page=4" class="page-btn">4</a>
					</li>
					<li class="page-item">
						<a href="/?page=5" class="page-btn">5</a>
					</li>
					-->
			
			        <li class="page-item">
			            <a th:if="${hasNext}" th:href="@{/(page=${currentPage + 1})}" class="page-btn next-btn">▶</a>
			            <span th:unless="${hasNext}" class="page-btn next-btn disabled">▶</span>
			        </li>
			        
			    </ul>
			</nav>
			
			<!-- 추가 버튼, 회원 클릭 시 모달창 -->
            <div id="modal-overlay" class="modal-overlay">
                <form id="member-form" action="/api/members/save" method="POST" enctype="multipart/form-data" class="modal-content">
                	<!-- 수정 모드면 memberId에 data-member-id가 담긴다. // index.js에 구현 -->
                    <input type="hidden" id="modal-member-id" name="memberId">
                    <div class="modal-profile-wrapper">
                        <label for="modal-profile-file" class="modal-profile-label" title="프로필 이미지 변경">
                            <img th:src="@{/images/dummy-profile.png}" id="modal-profile-preview" alt="Modal Profile" class="modal-profile-img">
                        </label>
                        <input type="file" id="modal-profile-file" name="images" class="modal-file-input" accept="image/*">
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="member-name-input" class="form-label">이름</label>
                            <input type="text" id="member-name-input" name="name" class="form-input" autocomplete="off" required>
                        </div>
                        <div class="form-group">
                            <label for="member-nickname-input" class="form-label">닉네임</label>
                            <input type="text" id="member-nickname-input" name="nickName" class="form-input" autocomplete="off" required>
                        </div>
                        <div class="form-group">
                            <label for="member-age-input" class="form-label">나이</label>
                            <input type="text" id="member-age-input" name="age" class="form-input" autocomplete="off" required>
                        </div>
                        <div class="form-group">
                            <label for="member-rating-input" class="form-label">RATING</label>
                            <input type="text" id="member-rating-input" name="rating" class="form-input" autocomplete="off" required>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="submit" id="save-member-btn" class="btn-save">저장</button>
                    </div>
                </form>
            </div>
            <script th:src="@{/js/index.js}"></script>
        </main>
    </div>
</body>
</html>
